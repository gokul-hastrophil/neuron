name: Engineering Controller CI

on:
  pull_request:
    paths:
      - 'infra/engineering-controller/**'
      - '.github/workflows/engineering-controller-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/engineering-controller/**'
      - '.github/workflows/engineering-controller-ci.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/engineering-controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q .
