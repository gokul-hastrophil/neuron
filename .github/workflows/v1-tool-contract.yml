name: Neuron V1 Tool Contract
on:
  push:
    branches: [feat/v1-playstore-task-contract]
  pull_request:
    paths:
      - 'contracts/v1/**'
      - 'tests/test_v1_tool_contract.py'
      - '.github/workflows/v1-tool-contract.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install 'jsonschema[format]>=4.18,<5'
      - name: Run schema contract tests
        run: python -m unittest discover -s tests -p 'test_v1_tool_contract.py' -v
